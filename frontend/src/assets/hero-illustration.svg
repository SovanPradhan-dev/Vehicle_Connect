<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shapes -->
  <rect width="600" height="400" rx="20" fill="url(#bgGradient)" />
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Road -->
  <rect x="50" y="300" width="500" height="20" rx="10" fill="#ffffff80"/>
  <line x1="50" y1="310" x2="550" y2="310" stroke="white" stroke-dasharray="10 10" stroke-width="2"/>

  <!-- Car body -->
  <rect x="250" y="260" width="100" height="40" rx="10" fill="#3B82F6"/>
  <rect x="270" y="240" width="60" height="20" rx="5" fill="#60A5FA"/>

  <!-- Wheels -->
  <circle cx="270" cy="305" r="8" fill="#1E40AF"/>
  <circle cx="330" cy="305" r="8" fill="#1E40AF"/>

  <!-- Floating abstract shapes -->
  <circle cx="100" cy="100" r="30" fill="#93C5FD" fill-opacity="0.4"/>
  <circle cx="500" cy="80" r="40" fill="#A78BFA" fill-opacity="0.4"/>
  <circle cx="450" cy="250" r="25" fill="#60A5FA" fill-opacity="0.3"/>
</svg>
